[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory-control"
version = "0.7.0"
description = "SQLite control plane for a review-first short-video factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
visual-qc = ["opencv-python-headless==4.10.0.84"]
caption-observer = ["faster-whisper==1.2.1"]

[project.scripts]
video-factory = "video_factory.cli:main"
video-factory-face-observer = "video_factory.face_observer:main"
caption-observer = "video_factory.caption_observer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_factory = ["schemas/*.schema.json"]
