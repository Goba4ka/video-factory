    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const camera = document.getElementById("media-camera");
      const phase = { scale: 1.32 };
      const drift = { p: 0 };

      tl.to(phase, { scale: 1.36, duration: 6.75, ease: "none" }, 0);
      tl.set(phase, { scale: 1.04 }, 6.98);
      tl.to(phase, { scale: 1.08, duration: 8.13, ease: "sine.inOut" }, 6.98);
      tl.to(phase, { scale: 1.04, duration: 11.32, ease: "sine.inOut" }, 15.12);
      tl.to(phase, { scale: 1.02, duration: 4.76, ease: "power2.inOut" }, 26.44);

      tl.to(
        drift,
        {
          p: Math.PI * 2,
          duration: 31.2,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 2.0;
            const dy = Math.sin(drift.p * 1.31) * 1.2;
            camera.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${phase.scale})`;
          },
        },
        0,
      );

      document.querySelectorAll(".caption-group").forEach((group) => {
        const text = group.querySelector(".caption-text");
        const start = Number(group.dataset.start);
        const duration = Number(group.dataset.duration);
        const entry = Math.min(0.20, duration * 0.18);
        const exit = Math.min(0.12, duration * 0.12);
        tl.set(group, { opacity: 1, visibility: "visible" }, start);
        tl.fromTo(
          text,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: entry, ease: "power3.out", immediateRender: false },
          start,
        );
        tl.to(
          text,
          { opacity: 0, y: -7, duration: exit, ease: "power2.in" },
          Math.max(start + entry, start + duration - exit),
        );
        tl.set(group, { opacity: 0, visibility: "hidden" }, start + duration);
      });

      tl.seek(0);
      window.__timelines["motivation-client-b"] = tl;
    </script>
