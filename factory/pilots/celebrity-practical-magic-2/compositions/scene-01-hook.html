        top: 42px;
        right: 78px;
        width: 20px;

      <div class="media-frame">

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook-media", { scale: 1 }, { scale: 1.06, duration: 7.731837, ease: "none" }, 0);
      tl.fromTo(".top-meta", { y: -34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" }, 0.16);

      tl.fromTo("#hook-source", { scaleX: 0.72, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.38, ease: "power2.out", transformOrigin: "0 50%" }, 0.82);
      tl.fromTo("#hook-sandra", { x: -300, rotationY: 22, opacity: 0 }, { x: 0, rotationY: 11, opacity: 1, duration: 0.86, ease: "power3.out" }, 0.98);

      tl.to("#hook-sandra", { y: -6, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.0);
      tl.to("#hook-nicole", { y: 6, duration: 1.95, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.0);
      tl.to("#hook-ring", { rotation: 18, scale: 1.04, duration: 7.5, ease: "none" }, 0.2);
      window.__timelines["scene-01-hook"] = tl;
    </script>
