        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .verified-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e4a853;
        box-shadow: 0 0 18px rgba(228, 168, 83, 0.56);
        will-change: opacity;
      }

      .progress-track {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 58px;
        height: 4px;
        background: rgba(217, 222, 255, 0.2);
        overflow: hidden;
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: #e4a853;
        transform: scaleX(0);
        transform-origin: 0 50%;
        will-change: transform;
      }
